[workspace]
resolver = "2"
members = ["projects/crates/*"]
default-members = ["projects/crates/cfd-model", "projects/crates/cfd-napi"]

[workspace.dependencies]
wae = { git = "https://github.com/doki-land/wae-framework.git", rev = "f92f818fde7174154d77a87b55a5e44b367034c9", default-features = false }
# Shared crates from boost.rs `dev`, pinned to the full 40-character revision
# so local builds and CI resolve the same commit.
science-mesh = { git = "https://github.com/oovm/boost.rs.git", rev = "f0c76fc60090650eefa1de1a4f2c2cbb29cba8d9" }
boost-check = { git = "https://github.com/oovm/boost.rs.git", rev = "f0c76fc60090650eefa1de1a4f2c2cbb29cba8d9" }
boost-session = { git = "https://github.com/oovm/boost.rs.git", rev = "f0c76fc60090650eefa1de1a4f2c2cbb29cba8d9" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
panic = "abort"
